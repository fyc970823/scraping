name: Hexo Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "00 8 * * *"   
    - cron: "00 16 * * *"  
    - cron: "00 00 * * *"  
  workflow_dispatch:          # 允許在 Actions 頁面手動執行

concurrency:
  group: hexo-deployment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write             # 需要寫入，才能把新資料存回儲存庫
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          pip install -r requirements.txt
          python fetch_top100.py
          python fetch_movies.py

      - name: Save new data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add source/_posts
          git diff --staged --quiet || git commit -m "Update daily data"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Files
        run: |
          npx hexo clean
          npx hexo generate

      - name: Verify generated site
        run: |
          test -f public/index.html || { echo "::error::Missing public/index.html"; exit 1; }
          find public -type f | wc -l

      - name: Add Pages marker
        run: touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
